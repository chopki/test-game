name: Browser tests (manual)

# Playwright desktop + phone browser tests. They don't run on push: start them from the Actions tab
# ("Run workflow") and choose the vital smoke set (~1–2 min) or the full regression suite.
# Locally: `npm run test:e2e` (smoke) or `npm run test:e2e:full`.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which tests to run
        type: choice
        options:
          - smoke
          - full
        default: smoke

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test ${{ inputs.suite == 'full' && ' ' || '--grep @smoke' }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
